name: Release

on:
  workflow_run:
    workflows: ["CI", "Security"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source SHA
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_SHA="$GITHUB_SHA"
          else
            SOURCE_SHA="$WORKFLOW_SHA"
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify CI and Security gates
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          RUNS="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&event=push&per_page=100")"
          CI="$(jq -r '[.workflow_runs[] | select(.name == "CI")][0].conclusion // "missing"' <<<"$RUNS")"
          SECURITY="$(jq -r '[.workflow_runs[] | select(.name == "Security")][0].conclusion // "missing"' <<<"$RUNS")"
          echo "CI=$CI Security=$SECURITY"
          if [ "$CI" = "success" ] && [ "$SECURITY" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release gate not ready; the other workflow completion will trigger another check."
          fi

      - name: Checkout validated commit
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Resolve version
        if: steps.gate.outputs.ready == 'true'
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data["project"]["version"])
          PY
          )"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      - name: Check existing release
        if: steps.gate.outputs.ready == 'true'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; assets will be refreshed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub Release
        if: steps.gate.outputs.ready == 'true' && steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$SOURCE_SHA"             --title "$TAG"             --generate-notes

      - name: Package Helm chart
        if: steps.gate.outputs.ready == 'true'
        uses: azure/setup-helm@v4

      - name: Upload Helm release asset
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          mkdir -p dist
          helm package deploy/helm/data-platform-mcp-server --destination dist
          gh release upload "$TAG" dist/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
