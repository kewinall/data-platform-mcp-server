name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest
      - name: Compile
        run: python -m compileall -q src

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: data-platform-mcp-server:ci

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Helm lint
        run: helm lint deploy/helm/data-platform-mcp-server -f tests/helm-values.yaml
      - name: Helm render
        run: |
          helm template dpmcp deploy/helm/data-platform-mcp-server             -f tests/helm-values.yaml > rendered.yaml
          test -s rendered.yaml
          grep -q "kind: NetworkPolicy" rendered.yaml
          grep -q "kind: ExternalSecret" rendered.yaml
          grep -q "readOnlyRootFilesystem: true" rendered.yaml
          grep -q "DPMCP_ETL_METADATA_DIR" rendered.yaml
          grep -q "/var/lib/data-platform-mcp/etl-metadata" rendered.yaml
