apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-workload-identity
  namespace: data-platform-mcp
  annotations:
    azure.workload.identity/client-id: "<managed-identity-client-id>"
    azure.workload.identity/tenant-id: "<entra-tenant-id>"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
  namespace: data-platform-mcp
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://<key-vault-name>.vault.azure.net"
      serviceAccountRef:
        name: external-secrets-workload-identity
