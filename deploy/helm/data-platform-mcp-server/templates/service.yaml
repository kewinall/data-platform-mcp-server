apiVersion: v1
kind: Service
metadata:
  name: {{ include "data-platform-mcp-server.fullname" . }}
  labels:
    {{- include "data-platform-mcp-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: mcp
      port: {{ .Values.service.port }}
      targetPort: mcp
      protocol: TCP
  selector:
    {{- include "data-platform-mcp-server.selectorLabels" . | nindent 4 }}
