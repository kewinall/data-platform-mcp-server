[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-platform-mcp-server"
version = "0.5.0"
description = "Production-oriented MCP server reference for data engineering and DataOps workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "kewinall"}]
dependencies = [
  "mcp[cli]>=2.0,<3.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlglot>=30.18,<31.0",
  "vertica-python>=1.4,<2.0",
  "PyJWT[crypto]>=2.13,<3.0",
  "opentelemetry-api>=1.44,<2.0",
  "opentelemetry-sdk>=1.44,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
  "pip-audit>=2.9,<3.0",
]

[project.scripts]
data-platform-mcp = "data_platform_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_platform_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
